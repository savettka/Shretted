{# One hidden sprite, included once per page. Tiles then reference a symbol
   with <use href="#eq-barbell">. Nothing is fetched over the network, which
   matters both on a free PythonAnywhere account and on gym wifi. #}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="eq-barbell" viewBox="0 0 32 32" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 16h14"/>
      <rect x="5" y="9" width="4.5" height="14" rx="1.5"/>
      <rect x="22.5" y="9" width="4.5" height="14" rx="1.5"/>
      <path d="M2.5 12.5v7M29.5 12.5v7"/>
    </symbol>

    <symbol id="eq-dumbbell" viewBox="0 0 32 32" fill="none" stroke="currentColor"
